# .streamlit/config.toml
# Streamlit Community Cloud deployment configuration for PAFCCI CyberAnalyser

[theme]
base = "dark"
primaryColor        = "#3B82F6"
backgroundColor     = "#0B1120"
secondaryBackgroundColor = "#111827"
textColor           = "#F3F4F6"
font                = "sans serif"

[server]
headless            = true
enableCORS          = false
enableXsrfProtection = true

[browser]
gatherUsageStats    = false

[runner]
fastReruns          = true

[client]
showSidebarNavigation = false
toolbarMode           = "viewer"
